name: build

# Build Webloom on every commit (all branches + PRs); also runnable by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

jobs:
  windows:
    name: windows / x86_64-msvc
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Use the newest stable toolchain: the crate is edition 2024 (needs rustc >= 1.85).
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version

      # Cache the cargo registry and the build directory between runs.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # .cargo/config.toml sets +crt-static for this target, so the exe is
      # standalone (no VC++ Redistributable needed). --locked pins Cargo.lock.
      - name: Build (release, static CRT)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Upload webloom.exe
        uses: actions/upload-artifact@v7
        with:
          name: webloom-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/webloom.exe
          if-no-files-found: error
